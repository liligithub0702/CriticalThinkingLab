<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical Thinker Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234a5bf7'/%3E%3Cpath d='M9 21V11h4.2a3.4 3.4 0 010 6.8H9m14 3.2l-4.6-10-4.6 10' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="A guided, six-stage critical thinking coach for team managers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  /* surfaces */
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #f1f2f8;
  --sidebar: #1b1f3b;
  --sidebar-2: #272c4d;
  --sidebar-text: #a4a8c2;
    /* ink */
  --text: #2b2f4c;
  --text-2: #6b7089;
  --muted: #9095ad;
  --line: #e9eaf2;
  --line-strong: #d7d9e6;
  /* brand */
  --accent: #4a5bf7;
  --accent-ink: #3948d8;
  --accent-soft: #e6e9fe;
  --on-accent: #ffffff;
  --pink: #f2416b;
  --pink-soft: #fde3ea;
  --teal: #0f9fbf;
  --teal-soft: #d8f1f8;
  --amber: #d98c00;
  --amber-soft: #fcf0d3;
  --violet: #7c4ddb;
  --violet-soft: #ece2fb;
  /* status */
  --good: #17a355;
  --warn: #d98c00;
  --bad: #e0294f;
  /* categorical series - validated for CVD on a white surface */
  --s1: #4a5bf7;
  --s2: #f2416b;
  --s3: #0f9fbf;
  --s4: #d98c00;
  --focus: #4a5bf7;
  --radius: 8px;
  --radius-lg: 10px;
  --shadow: 0 1px 3px rgba(28, 33, 83, 0.07), 0 1px 2px rgba(28, 33, 83, 0.04);
  --shadow-lift: 0 4px 16px rgba(28, 33, 83, 0.1);
  --topbar-h: 64px;
  --sidebar-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12152b;
    --surface: #232744;
    --surface-2: #2b3053;
    --sidebar: #171a33;
    --sidebar-2: #292e51;
    --sidebar-text: #a4a8c6;
    --text: #edeefb;
    --text-2: #b3b7d5;
    --muted: #888db0;
    --line: #313659;
    --line-strong: #3e446b;
    --accent: #7b86ff;
    --accent-ink: #9aa3ff;
    --accent-soft: #2d3266;
    --on-accent: #12152b;
    --pink: #ff5f85;
    --pink-soft: #46253c;
    --teal: #22b8d6;
    --teal-soft: #13384a;
    --amber: #e0a200;
    --amber-soft: #40341a;
    --violet: #a481ef;
    --violet-soft: #33275a;
    --good: #35c46f;
    --warn: #e0a200;
    --bad: #ff6b86;
    --s1: #6d79f5;
    --s2: #f04c72;
    --s3: #17a2bd;
    --s4: #c98500;
    --focus: #9aa3ff;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.34);
    --shadow-lift: 0 6px 20px rgba(0, 0, 0, 0.42);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12152b;
  --surface: #232744;
  --surface-2: #2b3053;
  --sidebar: #171a33;
  --sidebar-2: #292e51;
  --sidebar-text: #a4a8c6;
  --text: #edeefb;
  --text-2: #b3b7d5;
  --muted: #888db0;
  --line: #313659;
  --line-strong: #3e446b;
  --accent: #7b86ff;
  --accent-ink: #9aa3ff;
  --accent-soft: #2d3266;
  --on-accent: #12152b;
  --pink: #ff5f85;
  --pink-soft: #46253c;
  --teal: #22b8d6;
  --teal-soft: #13384a;
  --amber: #e0a200;
  --amber-soft: #40341a;
  --violet: #a481ef;
  --violet-soft: #33275a;
  --good: #35c46f;
  --warn: #e0a200;
  --bad: #ff6b86;
  --s1: #6d79f5;
  --s2: #f04c72;
  --s3: #17a2bd;
  --s4: #c98500;
  --focus: #9aa3ff;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.34);
  --shadow-lift: 0 6px 20px rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1875rem; }
h3 { font-size: 0.9375rem; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.logo {
  font-weight: 700; font-size: 1.125rem; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--accent);
  margin-right: auto; white-space: nowrap;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.logo span { color: var(--text); font-weight: 600; letter-spacing: 0.04em; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.pill b { text-transform: capitalize; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid transparent; color: var(--text-2);
  font: inherit; font-size: 0.8125rem; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.pill:hover { color: var(--text); border-color: var(--line-strong); }
.pill-static { cursor: default; }
.pill-static:hover { color: var(--text-2); border-color: transparent; }
.pill b { color: var(--accent); font-weight: 600; }
.icon-btn {
  display: none; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: var(--radius);
  background: var(--surface-2); border: 0; color: var(--text-2); cursor: pointer;
}

/* ---- shell ---- */
.shell { display: flex; align-items: flex-start; min-height: calc(100vh - var(--topbar-h)); }
.sidebar {
  position: sticky; top: var(--topbar-h); z-index: 30;
  flex: none; width: var(--sidebar-w);
  align-self: stretch; min-height: calc(100vh - var(--topbar-h));
  background: var(--sidebar);
  padding: 22px 14px 40px;
}
.nav-label {
  font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: #656a8d; padding: 0 12px; margin: 0 0 10px;
}
.nav-label + .nav-label, .nav-group + .nav-label { margin-top: 26px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.tab {
  display: flex; align-items: center; gap: 12px; width: 100%;
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 0.875rem; color: var(--sidebar-text);
  padding: 11px 12px; border-radius: var(--radius); text-align: left;
}
.tab svg { flex: none; opacity: 0.85; }
.tab:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
.tab[aria-current="page"] { background: var(--sidebar-2); color: #fff; font-weight: 500; }
.tab[aria-current="page"] svg { opacity: 1; color: var(--accent); }
.nav-note {
  margin: 26px 12px 0; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 0.75rem; line-height: 1.6; color: #757a9c;
}
.scrim { display: none; }

.content { flex: 1; min-width: 0; padding: 28px 28px 96px; }
main { max-width: 1140px; margin: 0 auto; }
#view-session { max-width: 800px; }
.view[hidden] { display: none; }
.stack > * + * { margin-top: 20px; }
.stack-s > * + * { margin-top: 14px; }

/* ---- controls ---- */
button { font: inherit; }
.btn {
  appearance: none; cursor: pointer; font: inherit; font-size: 0.875rem; font-weight: 500;
  padding: 10px 18px; border-radius: var(--radius);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  box-shadow: 0 2px 8px rgba(74, 91, 247, 0.28);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-quiet { border-color: transparent; background: none; color: var(--text-2); padding-inline: 12px; }
.btn-quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--text); border-color: transparent; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1 1 auto; }

textarea {
  width: 100%; min-height: 190px; resize: vertical;
  font: inherit; line-height: 1.7;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 15px 17px;
}
textarea::placeholder { color: var(--muted); }
textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }

select {
  font: inherit; font-size: 0.8125rem; font-weight: 500; color: var(--text);
  background: var(--surface-2);
  border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px;
}

/* ---- stage indicator ---- */
.steps { display: flex; gap: 6px; list-style: none; margin: 0 0 4px; padding: 0; }
.step { flex: 1 1 0; min-width: 0; }
.step-btn {
  width: 100%; text-align: left; appearance: none; cursor: pointer; font: inherit;
  background: none; border: 0; border-top: 3px solid var(--line-strong);
  padding: 9px 2px 0; color: var(--muted); font-size: 0.75rem; line-height: 1.35;
}
.step-btn:disabled { cursor: default; }
.step-n { display: block; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.6875rem; letter-spacing: 0.04em; }
.step-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step.done .step-btn { border-top-color: var(--accent-ink); color: var(--text-2); }
.step.current .step-btn { border-top-color: var(--accent); color: var(--text); font-weight: 600; }

/* ---- cards ---- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 22px 24px; box-shadow: var(--shadow);
}
.card-accent { border-left: 3px solid var(--accent); }
.card-flag { border-left: 3px solid var(--warn); }
.card h2 + p, .card h3 + p { margin-top: 8px; }
.eyebrow {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); font-weight: 600; margin-bottom: 10px;
}
.lede { color: var(--text-2); }
.hint { color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; line-height: 1.7; }
.tag {
  display: inline-block; font-size: 0.75rem; font-weight: 500;
  border: 0; border-radius: var(--radius); padding: 5px 12px;
  color: var(--text-2); background: var(--surface-2);
}
.tag-flaw { background: var(--amber-soft); color: var(--text); }

/* ---- dashboard hero ---- */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.hero-top { display: flex; gap: 26px; align-items: center; padding: 26px 28px; flex-wrap: wrap; }
.hero-badge {
  flex: none; width: 104px; height: 104px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; text-align: center;
  font-weight: 700; font-size: 1.375rem; letter-spacing: 0.02em;
}
.hero-body { flex: 1 1 320px; min-width: 0; }
.hero-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; color: var(--text-2); font-size: 0.8125rem; }
.hero-meta span { display: inline-flex; align-items: center; gap: 7px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hero-stats { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); }
.hero-stat { flex: 1 1 150px; padding: 16px 24px; border-right: 1px solid var(--line); }
.hero-stat:last-child { border-right: 0; }
.hero-stat b { display: block; font-size: 1.0625rem; font-weight: 600; }
.hero-stat span { font-size: 0.75rem; color: var(--muted); }

/* ---- dashboard ---- */
.dash-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.dash-head .spacer { flex: 1 1 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 16px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 18px 20px; box-shadow: var(--shadow);
}
/* Name and badge share the top row; the value always gets the full width, so
   a long value never collides with the badge in a narrow column. */
.tile-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tile-name { font-size: 0.8125rem; font-weight: 500; color: var(--text-2); padding-top: 8px; }
.tile-val { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.tile-unit { font-size: 0.8125rem; font-weight: 500; color: var(--text-2); margin-left: 3px; }
.tile-foot { font-size: 0.75rem; color: var(--text-2); margin-top: 8px; line-height: 1.5; }
.tile-badge {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
}
.tile.is-focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.delta-good { color: var(--good); }
.delta-bad { color: var(--bad); }

.chart-block {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 20px 22px; box-shadow: var(--shadow);
}
.chart-block h3 { margin-bottom: 2px; }
.chart-note { color: var(--muted); font-size: 0.8125rem; margin-bottom: 14px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8125rem; color: var(--text-2); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.08s;
  background: var(--surface); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: var(--radius); padding: 8px 11px; font-size: 0.8125rem; line-height: 1.5;
  box-shadow: var(--shadow-lift); white-space: nowrap; z-index: 5;
}
.tip.on { opacity: 1; }

details { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
details > summary {
  cursor: pointer; font-size: 0.8125rem; color: var(--accent); font-weight: 500;
  list-style: none; display: inline-flex; align-items: center; gap: 7px;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+"; font-weight: 600; width: 1ch; }
details[open] > summary::before { content: "\2212"; }
.table-wrap { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; }
th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 600; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
tbody tr:hover td, tbody tr:hover th { background: var(--surface-2); }

.notes { margin: 0; padding-left: 1.15em; color: var(--text-2); font-size: 0.875rem; }
.notes li + li { margin-top: 9px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 7px 20px; font-size: 0.875rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---- scores ---- */
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.score {
  border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px;
  background: var(--surface); box-shadow: var(--shadow);
}
.score-head { display: flex; align-items: baseline; gap: 10px; }
.score-name { font-size: 0.8125rem; font-weight: 500; color: var(--text-2); }
.score-val { font-size: 1.5rem; font-weight: 600; margin-left: auto; letter-spacing: -0.02em; }
.score-bar { height: 7px; border-radius: 4px; background: var(--surface-2); margin: 12px 0 10px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 4px; }
.score-just { font-size: 0.8125rem; color: var(--text-2); line-height: 1.55; }

.chain { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.chain li { counter-increment: st; padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1.85rem 1fr; gap: 12px; }
.chain li:last-child { border-bottom: 0; }
.chain li::before {
  content: counter(st); color: var(--accent); background: var(--accent-soft);
  font-weight: 600; font-size: 0.75rem; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
}
.chain b { display: block; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }

.sessions { list-style: none; margin: 0; padding: 0; }
.sessions li { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sessions li:last-child { border-bottom: 0; }
.sessions .title { font-weight: 500; }
.sessions .when { color: var(--muted); font-size: 0.8125rem; }

.banner { border-radius: var(--radius); padding: 13px 16px; font-size: 0.875rem; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); }
.banner-bad { border-color: var(--bad); background: var(--surface); }
.busy { color: var(--text-2); font-size: 0.875rem; display: inline-flex; align-items: center; gap: 9px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0.6; } }

.file-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type="file"] { display: none; }
.count { font-size: 0.8125rem; color: var(--muted); }

@media (max-width: 900px) {
  .icon-btn { display: inline-flex; }
  .topbar { padding: 0 16px; gap: 12px; }
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
    transform: translateX(-100%); transition: transform 0.2s ease;
    box-shadow: var(--shadow-lift); overflow-y: auto;
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim {
    display: block; position: fixed; inset: var(--topbar-h) 0 0 0;
    background: rgba(20, 24, 55, 0.45); z-index: 25; border: 0;
  }
  .content { padding: 20px 16px 80px; }
  /* The sidebar already shows stage state on small screens, so the topbar
     keeps only the brand, the menu button and a compact theme control. */
  #stage-pill { display: none; }
  .topbar .lbl { display: none; }
}
@media (max-width: 640px) {
  h1 { font-size: 1.3125rem; }
  .step-name { display: none; }
  .step-btn { text-align: center; padding-inline: 0; }
  .card, .chart-block { padding: 16px 17px; }
  .hero-top { padding: 20px; gap: 18px; }
  .hero-badge { width: 76px; height: 76px; font-size: 1.0625rem; }
  .hero-stat { padding: 14px 18px; }
  .logo { font-size: 1rem; }
}
@media (max-width: 480px) {
  /* keep the full wordmark rather than ellipsising it */
  .logo { font-size: 0.8125rem; letter-spacing: 0.04em; }
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="nav-toggle" aria-label="Show menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <span class="logo">Critical <span>Thinker Pro</span></span>
  <div class="topbar-actions">
    <span class="pill pill-static" id="stage-pill" hidden></span>
    <button class="pill" id="theme-btn">Theme: system</button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="tabs" aria-label="Views">
    <p class="nav-label">Menu</p>

<script>
"use strict";

/* ===================================================================== *
 * Critical Thinker Pro - single-page client.
 * Every coach response comes from POST /api/coach (a real model call).
 * All model-facing prompt text lives server-side in api/_prompts.js.
 * ===================================================================== */

/* ---------- small helpers ---------- */

const $ = (sel, root) => (root || document).querySelector(sel);

function el(tag, attrs, kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (k === "style") Object.assign(node.style, v);
      else node.setAttribute(k, v === true ? "" : v);
    }
  }
  for (const kid of [].concat(kids || [])) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return node;
}

const SVG_NS = "http://www.w3.org/2000/svg";

/* Stroked line icons, drawn inline. Paths keyed by name. */
const ICON_PATHS = {
  smile: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z", "M8.5 14.5a4.5 4.5 0 0 0 7 0", "M9 9.5h.01", "M15 9.5h.01"],
  message: ["M21 12a8 8 0 0 1-8 8H7l-4 2 1.2-3.6A8 8 0 1 1 21 12Z", "M8.5 11.5h7"],
  check: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z", "m8.5 12.2 2.4 2.4 4.6-4.8"],
  shield: ["M12 3 5 6v5.5c0 4 3 7.5 7 9.5 4-2 7-5.5 7-9.5V6l-7-3Z", "m9 12 2 2 4-4"],
  clock: ["M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z", "M12 7.5V12l3 1.8"],
  eye: ["M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z", "M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"]
};

function icon(name, size) {
  const node = svg("svg", {
    width: size || 20, height: size || 20, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", "stroke-width": 1.7, "stroke-linecap": "round",
    "stroke-linejoin": "round", "aria-hidden": "true"
  });
  (ICON_PATHS[name] || []).forEach((d) => node.appendChild(svg("path", { d })));
  return node;
}
function svg(tag, attrs, kids) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined) continue;
    if (k === "style") Object.assign(node.style, v);
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const kid of [].concat(kids || [])) if (kid) node.appendChild(kid);
  return node;
}

const pct1 = (v) => (v * 100).toFixed(1) + "%";
const mins = (v) => v.toFixed(2) + " min";
const n0 = (v) => Math.round(v).toLocaleString("en-GB");
const n1 = (v) => v.toLocaleString("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function fmtVal(v, format) {
  return format === "min" ? mins(v) : pct1(v);
}

function store(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }
}
function drop(key) {
  try { localStorage.removeItem(key); } catch { /* ignore */ }
}

const SESSIONS_KEY = "ctp.sessions.v1";
const DRAFT_KEY = "ctp.draft.v1";
const THEME_KEY = "ctp.theme.v1";
const DIMS = [
  { id: "clarity", label: "Clarity of reasoning", color: "var(--s1)" },
  { id: "evidence", label: "Quality of evidence", color: "var(--s2)" },
  { id: "assumptions", label: "Awareness of assumptions", color: "var(--s3)" },
  { id: "openness", label: "Openness to disagreement", color: "var(--s4)" }
];

/* ---------- state ---------- */

const state = {
  view: "session",
  stages: [],
  dash: null,
  index: 0,          // 0..5 stage index, 6 = summary screen
  entries: [],       // per stage: { input, coach, flaw, onTopic, scores, opposingCase }
  summary: null,
  busy: null,        // description of the in-flight request
  error: "",
  breakdown: "csat",
  sessions: store(SESSIONS_KEY, []),
  reviewing: null    // a past session opened from Progress
};

function entry(i) {
  if (!state.entries[i]) state.entries[i] = { input: "", coach: "", flaw: null, onTopic: true, scores: null, opposingCase: "" };
  return state.entries[i];
}
function stageDone(i) {
  const e = state.entries[i];
  return Boolean(e && e.coach && e.onTopic !== false);
}
function saveDraft() {
  save(DRAFT_KEY, { index: state.index, entries: state.entries, summary: state.summary });
}

/* ---------- api ---------- */

async function api(action, payload) {
  const res = await fetch("/api/coach", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON error page */ }
  if (!res.ok) throw new Error((data && data.error) || "Request failed (" + res.status + ").");
  return data;
}

function historyPayload(upto) {
  const out = [];
  for (let i = 0; i < upto; i++) {
    const e = state.entries[i];
    if (!e || !e.input) continue;
    out.push({ stage: i + 1, input: e.input, coach: e.coach, opposingCase: e.opposingCase, scores: e.scores });
  }
  return out;
}

/* ===================================================================== *
 * Charts - hand-rolled SVG, no dependencies. Colours come from CSS
 * custom properties, so a theme change needs no redraw.
 * ===================================================================== */

const chartRegistries = { dash: [], view: [] };
let chartTarget = "view";

function redrawAll() {
  chartRegistries.dash.forEach((fn) => fn());
  chartRegistries.view.forEach((fn) => fn());
}

function chartHost(parent, draw) {
  const box = el("div", { class: "chart" });
  const tip = el("div", { class: "tip" });
  parent.appendChild(box);
  box.appendChild(tip);
  const redraw = () => {
    const width = Math.max(280, box.clientWidth || 640);
    [...box.children].forEach((c) => { if (c !== tip) c.remove(); });
    box.insertBefore(draw(width, tip, box), tip);
  };
  chartRegistries[chartTarget].push(redraw);
  requestAnimationFrame(redraw);
  return box;
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawAll, 120);
});

function showTip(tip, box, x, y, html) {
  tip.innerHTML = html;
  tip.classList.add("on");
  const w = tip.offsetWidth;
  const left = Math.min(Math.max(4, x - w / 2), box.clientWidth - w - 4);
  tip.style.left = left + "px";
  tip.style.top = Math.max(0, y) + "px";
}
function hideTip(tip) { tip.classList.remove("on"); }

function niceStep(raw) {
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}

/* Axis bounds snapped to a round tick interval. */
function niceBounds(values, extra) {
  const all = values.concat(extra === undefined ? [] : [extra]);
  const lo = Math.min.apply(null, all);
  const hi = Math.max.apply(null, all);
  const span = hi - lo || Math.abs(hi) || 1;
  const step = niceStep((span * 1.24) / 4);
  return {
    min: Math.floor((lo - span * 0.12) / step) * step,
    max: Math.ceil((hi + span * 0.12) / step) * step,
    step
  };
}

function ticksFor(min, max, step) {
  const out = [];
  const n = Math.round((max - min) / step);
  for (let i = 0; i <= n; i++) out.push(min + step * i);
  return out;
}

/**
 * Multi-series line chart with a hover crosshair and direct labels.
 * series: [{ name, color, values: number[] }]
 */
function lineChart(width, tip, box, opts) {
  const cats = opts.categories;
  const labelSpace = opts.direct === false ? 14 : 104;
  const pad = { l: 52, r: labelSpace, t: 14, b: 30 };
  const h = opts.height || 250;
  const iw = Math.max(40, width - pad.l - pad.r);
  const ih = h - pad.t - pad.b;
  const min = opts.min;
  const max = opts.max;
  const x = (i) => pad.l + (cats.length === 1 ? iw / 2 : (iw * i) / (cats.length - 1));
  const y = (v) => pad.t + ih - ((v - min) / (max - min)) * ih;
  const root = svg("svg", { viewBox: `0 0 ${width} ${h}`, width, height: h, role: "img", "aria-label": opts.title });

  ticksFor(min, max, opts.step || (max - min) / 4).forEach((t) => {
    root.appendChild(svg("line", { x1: pad.l, x2: pad.l + iw, y1: y(t), y2: y(t), style: { stroke: "var(--line)" }, "stroke-width": 1 }));
    root.appendChild(svg("text", {
      x: pad.l - 10, y: y(t) + 4, "text-anchor": "end", "font-size": 11,
      style: { fill: "var(--muted)" }, text: opts.axisFmt(t)
    }));
  });

  if (opts.target !== undefined && opts.target >= min && opts.target <= max) {
    root.appendChild(svg("line", {
      x1: pad.l, x2: pad.l + iw, y1: y(opts.target), y2: y(opts.target),
      style: { stroke: "var(--line-strong)" }, "stroke-width": 1.5, "stroke-dasharray": "5 4"
    }));
    root.appendChild(svg("text", {
      x: pad.l + iw, y: y(opts.target) - 6, "text-anchor": "end", "font-size": 11,
      style: { fill: "var(--muted)" }, text: "Target " + opts.axisFmt(opts.target)
    }));
  }

  cats.forEach((c, i) => {
    root.appendChild(svg("text", {
      x: x(i), y: h - 10, "text-anchor": "middle", "font-size": 11,
      style: { fill: "var(--muted)" }, text: c
    }));
  });

  const crosshair = svg("line", {
    y1: pad.t, y2: pad.t + ih, style: { stroke: "var(--line-strong)" },
    "stroke-width": 1, opacity: 0
  });
  root.appendChild(crosshair);

  opts.series.forEach((s) => {
    const pts = s.values.map((v, i) => x(i) + "," + y(v)).join(" ");
    root.appendChild(svg("polyline", {
      points: pts, fill: "none", style: { stroke: s.color },
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
    s.values.forEach((v, i) => {
      root.appendChild(svg("circle", {
        cx: x(i), cy: y(v), r: 4, style: { fill: s.color, stroke: "var(--surface)" }, "stroke-width": 2
      }));
    });
    if (opts.direct !== false) {
      const last = s.values.length - 1;
      root.appendChild(svg("rect", {
        x: pad.l + iw + 8, y: y(s.values[last]) - 4, width: 8, height: 8, rx: 2, style: { fill: s.color }
      }));
      root.appendChild(svg("text", {
        x: pad.l + iw + 21, y: y(s.values[last]) + 4, "font-size": 11,
        style: { fill: "var(--text-2)" }, text: s.name
      }));
    }
  });

  const overlay = svg("rect", { x: pad.l, y: pad.t, width: iw, height: ih, fill: "transparent" });
  root.appendChild(overlay);
  const nearest = (evt) => {
    const r = root.getBoundingClientRect();
    const px = ((evt.clientX - r.left) / r.width) * width;
    let best = 0;
    cats.forEach((_, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
    return best;
  };
  overlay.addEventListener("pointermove", (evt) => {
    const i = nearest(evt);
    crosshair.setAttribute("x1", x(i));
    crosshair.setAttribute("x2", x(i));
    crosshair.setAttribute("opacity", 1);
    const scale = box.clientWidth / width;
    const rows = opts.series
      .map((s) => `<div><b style="color:var(--text)">${s.name}</b> ${opts.tipFmt(s.values[i])}</div>`)
      .join("");
    showTip(tip, box, x(i) * scale, pad.t * scale + 6, `<div style="color:var(--muted);margin-bottom:2px">${cats[i]}</div>${rows}`);
  });
  overlay.addEventListener("pointerleave", () => { crosshair.setAttribute("opacity", 0); hideTip(tip); });
  return root;
}

/**
 * Horizontal bar chart. items: [{ label, value, sub }]
 */
function barChart(width, tip, box, opts) {
  const items = opts.items;
  const rowH = opts.rowH || 28;
  const gap = 6;
  const labelW = Math.min(Math.max(80, Math.round(width * 0.24)), 180);
  const valueW = 84;
  const pad = { l: labelW + 12, r: valueW, t: 6, b: 22 };
  const iw = Math.max(40, width - pad.l - pad.r);
  const h = pad.t + items.length * (rowH + gap) + pad.b;
  const max = opts.max;
  const root = svg("svg", { viewBox: `0 0 ${width} ${h}`, width, height: h, role: "img", "aria-label": opts.title });
  const bw = (v) => Math.max(2, (Math.max(0, v) / max) * iw);

  items.forEach((it, i) => {
    const y = pad.t + i * (rowH + gap);
    const barH = rowH - 6;
    const w = bw(it.value);
    const color = it.color || opts.color || "var(--s1)";
    const r = Math.min(4, w);
    const path = `M${pad.l},${y} H${pad.l + w - r} Q${pad.l + w},${y} ${pad.l + w},${y + r} V${y + barH - r} Q${pad.l + w},${y + barH} ${pad.l + w - r},${y + barH} H${pad.l} Z`;
    const bar = svg("path", { d: path, style: { fill: color } });
    root.appendChild(bar);

    root.appendChild(svg("text", {
      x: labelW, y: y + barH / 2 + 4, "text-anchor": "end", "font-size": 12,
      style: { fill: "var(--text-2)" }, text: it.label
    }));
    root.appendChild(svg("text", {
      x: pad.l + w + 8, y: y + barH / 2 + 4, "font-size": 12,
      style: { fill: "var(--text)" }, "font-weight": 500, text: opts.fmt(it.value)
    }));

    const hit = svg("rect", { x: 0, y: y - 3, width, height: rowH, fill: "transparent" });
    root.appendChild(hit);
    hit.addEventListener("pointerenter", () => {
      bar.style.opacity = 0.75;
      const scale = box.clientWidth / width;
      showTip(tip, box, (pad.l + w) * scale, (y - 6) * scale,
        `<div><b>${it.label}</b> ${opts.fmt(it.value)}</div>${it.sub ? `<div style="color:var(--text-2)">${it.sub}</div>` : ""}`);
    });
    hit.addEventListener("pointerleave", () => { bar.style.opacity = 1; hideTip(tip); });
  });

  if (opts.target !== undefined && opts.target <= max) {
    const tx = pad.l + (opts.target / max) * iw;
    root.appendChild(svg("line", {
      x1: tx, x2: tx, y1: pad.t - 4, y2: h - pad.b + 4,
      style: { stroke: "var(--line-strong)" }, "stroke-width": 1.5, "stroke-dasharray": "5 4"
    }));
    root.appendChild(svg("text", {
      x: tx, y: h - 6, "text-anchor": "middle", "font-size": 11,
      style: { fill: "var(--muted)" }, text: "Target " + opts.fmt(opts.target)
    }));
  }
  return root;
}

function legend(series) {
  return el("div", { class: "legend" }, series.map((s) =>
    el("span", null, [el("i", { class: "swatch", style: { background: s.color } }), s.name])
  ));
}

function dataTable(head, rows) {
  return el("details", null, [
    el("summary", { text: "Data table" }),
    el("div", { class: "table-wrap" }, [
      el("table", null, [
        el("thead", null, [el("tr", null, head.map((h) => el("th", { text: h, scope: "col" })))]),
        el("tbody", null, rows.map((r) => el("tr", null, r.map((c, i) =>
          i === 0 ? el("th", { text: String(c), scope: "row", style: { fontWeight: "400" } }) : el("td", { text: String(c) })
        ))))
      ])
    ])
  ]);
}

function chartBlock(title, note, draw, table) {
  const block = el("div", { class: "chart-block" }, [
    el("h3", { text: title }),
    note ? el("p", { class: "chart-note", text: note }) : null
  ]);
  if (draw.legendSeries) block.appendChild(legend(draw.legendSeries));
  chartHost(block, draw);
  if (table) block.appendChild(table);
  return block;
}
</script>

<script>
"use strict";

/* ===================================================================== *
 * The metric dashboard. Built once, then moved between the Dashboard
 * view and the expander inside the session so the learner can consult it
 * without losing their place.
 * ===================================================================== */

let dashNode = null;

/* Badge colour and glyph per KPI. Decorative identity, not a data encoding. */
const TILE_LOOK = {
  csat: { bg: "var(--accent-soft)", fg: "var(--accent)", icon: "smile" },
  nps: { bg: "var(--pink-soft)", fg: "var(--pink)", icon: "message" },
  fcr: { bg: "var(--teal-soft)", fg: "var(--teal)", icon: "check" },
  qa: { bg: "var(--amber-soft)", fg: "var(--amber)", icon: "shield" },
  aht: { bg: "var(--violet-soft)", fg: "var(--violet)", icon: "clock" }
};

function focusKpi() {
  return state.dash.kpis.find((k) => k.id === state.dash.focus);
}
function breakdownKpi() {
  return state.dash.kpis.find((k) => k.id === state.breakdown);
}

function buildDashboard() {
  chartRegistries.dash.length = 0;
  chartTarget = "dash";
  const d = state.dash;
  const k = breakdownKpi();
  const fk = focusKpi();
  const fmt = (v) => fmtVal(v, k.format);

  dashNode = el("div", { class: "stack", id: "dashboard" });

  /* hero */
  dashNode.appendChild(el("div", { class: "hero" }, [
    el("div", { class: "hero-top" }, [
      el("div", { class: "hero-badge", title: fk.full }, [fk.name]),
      el("div", { class: "hero-body" }, [
        el("div", { class: "hero-title" }, [
          el("h1", { text: d.meta.title }),
          el("span", { class: "tag", text: `Assigned metric: ${fk.name}` })
        ]),
        el("div", { class: "hero-meta" }, [
          el("span", null, [icon("eye", 15), d.meta.org]),
          el("span", { text: d.meta.scope }),
          el("span", null, [icon("clock", 15), d.meta.period]),
          el("span", { text: `Source: ${d.meta.source}` })
        ]),
        el("div", { class: "chips" }, [
          el("span", { class: "tag", text: fk.full }),
          el("span", { class: "tag", text: fk.source }),
          el("span", { class: "tag", text: `Target ${fmtVal(fk.target, fk.format)}` })
        ])
      ])
    ]),
    el("div", { class: "hero-stats" }, [
      ["Calls handled", n0(d.totals.calls)],
      ["Surveys returned", n1(d.totals.surveys)],
      ["Survey return rate", pct1(d.totals.surveyReturnRate)],
      ["Consultants", String(d.totals.agents)],
      ["Teams", String(d.totals.teams)],
      ["QA audits", n0(d.qaAudits.audits)]
    ].map(([label, value]) => el("div", { class: "hero-stat" }, [
      el("b", { text: value }),
      el("span", { text: label })
    ])))
  ]));

  dashNode.appendChild(el("div", { class: "dash-head" }, [
    el("h2", { text: "Key performance indicators" }),
    el("span", { class: "spacer" }),
    el("label", { class: "hint", style: { display: "flex", gap: "8px", alignItems: "center" } }, [
      "Break down by",
      el("select", {
        "aria-label": "Metric to break down",
        onchange: (e) => { state.breakdown = e.target.value; rebuildDashboard(); }
      }, d.kpis.map((x) => el("option", { value: x.id, selected: x.id === state.breakdown, text: x.name })))
    ])
  ]));

  /* KPI tiles */
  dashNode.appendChild(el("div", { class: "tiles" }, d.kpis.map((x) => {
    const off = x.better === "lower" ? x.value - x.target : x.target - x.value;
    const good = off <= 0;
    const gapTxt = x.format === "min"
      ? `${Math.abs(x.value - x.target).toFixed(2)} min ${x.value > x.target ? "above" : "below"}`
      : `${(Math.abs(x.value - x.target) * 100).toFixed(1)} pts ${x.value > x.target ? "above" : "below"}`;
    const look = TILE_LOOK[x.id] || TILE_LOOK.csat;
    return el("div", { class: "tile" + (x.id === d.focus ? " is-focus" : "") }, [
      el("div", { class: "tile-row" }, [
        el("div", { class: "tile-name", text: x.name }),
        el("div", { class: "tile-badge", style: { background: look.bg, color: look.fg } }, [icon(look.icon, 21)])
      ]),
      el("div", { class: "tile-val" }, [
        x.format === "min" ? String(x.value.toFixed(2)) : pct1(x.value),
        x.format === "min" ? el("span", { class: "tile-unit", text: "min" }) : null
      ]),
      el("div", { class: "tile-foot" }, [
        el("span", { class: good ? "delta-good" : "delta-bad", text: gapTxt }),
        el("span", { text: ` \u00b7 target ${fmtVal(x.target, x.format)}` })
      ])
    ]);
  })));

  /* weekly rate KPIs */
  const rateIds = ["csat", "nps", "fcr", "qa"];
  const rateSeries = rateIds.map((id, i) => ({
    name: d.kpis.find((x) => x.id === id).name,
    color: `var(--s${i + 1})`,
    values: d.weeks.map((w) => w[id])
  }));
  const rateVals = rateSeries.reduce((a, s) => a.concat(s.values), []);
  const rateB = niceBounds(rateVals);
  const drawRates = (w, tip, box) => lineChart(w, tip, box, {
    title: "Survey KPIs by week",
    categories: d.weeks.map((x) => x.week.replace("Week ", "Wk ")),
    series: rateSeries, min: rateB.min, max: rateB.max, step: rateB.step,
    axisFmt: (v) => (v * 100).toFixed(0) + "%", tipFmt: pct1
  });
  drawRates.legendSeries = rateSeries;
  dashNode.appendChild(chartBlock(
    "Survey KPIs by week",
    "CSAT, NPS and FCR come from the same survey. Targets differ per KPI and are shown on the tiles above, not here. The axis does not start at zero.",
    drawRates,
    dataTable(["Week", "CSAT", "NPS", "FCR", "QA"],
      d.weeks.map((w) => [w.week, pct1(w.csat), pct1(w.nps), pct1(w.fcr), pct1(w.qa)]))
  ));

  /* AHT by week */
  const ahtVals = d.weeks.map((w) => w.aht);
  const ahtB = niceBounds(ahtVals, 20);
  const drawAht = (w, tip, box) => lineChart(w, tip, box, {
    title: "Average handling time by week",
    categories: d.weeks.map((x) => x.week.replace("Week ", "Wk ")),
    series: [{ name: "AHT", color: "var(--s2)", values: ahtVals }],
    min: ahtB.min, max: ahtB.max, step: ahtB.step, target: 20, direct: false,
    axisFmt: (v) => v.toFixed(0), tipFmt: mins
  });
  dashNode.appendChild(chartBlock(
    "Average handling time by week",
    "Minutes per call, including hold time and after-call work. The only KPI here that does not come from the survey.",
    drawAht,
    dataTable(["Week", "AHT (min)", "Calls"], d.weeks.map((w) => [w.week, w.aht.toFixed(2), n0(w.calls)]))
  ));

  /* survey volume by week */
  const drawVol = (w, tip, box) => barChart(w, tip, box, {
    title: "Surveys returned by week",
    items: d.weeks.map((x) => ({
      label: x.week, value: x.surveys,
      sub: `${pct1(x.surveyShare)} of the month · ${n0(x.calls)} calls handled`
    })),
    max: Math.max.apply(null, d.weeks.map((x) => x.surveys)) * 1.08,
    fmt: (v) => n1(v), color: "var(--s3)", rowH: 30
  });
  dashNode.appendChild(chartBlock(
    "Surveys returned by week",
    "How much of the month's survey sample each week contributes. Week 2 supplies 32.8% of it and week 3 supplies 21.0%.",
    drawVol,
    dataTable(["Week", "Surveys", "Share", "Calls"],
      d.weeks.map((w) => [w.week, n1(w.surveys), pct1(w.surveyShare), n0(w.calls)]))
  ));

  /* breakdown: teams */
  const teamMax = Math.max.apply(null, d.teams.map((t) => t[state.breakdown]).concat([k.target])) * 1.18;
  const drawTeams = (w, tip, box) => barChart(w, tip, box, {
    title: k.name + " by team",
    items: d.teams.map((t) => ({
      label: t.team,
      value: t[state.breakdown],
      sub: `${t.manager} · ${t.agents} agents · ${n1(t.surveys)} surveys (${pct1(t.surveyShare)}) · AHT ${mins(t.aht)}`
    })),
    max: teamMax, fmt, target: k.target, color: "var(--s1)", rowH: 30
  });
  dashNode.appendChild(chartBlock(
    k.name + " by team",
    "Each team is 15 consultants. The figure is the unweighted mean of its agents' weekly rates, so agents with very different survey counts carry equal weight.",
    drawTeams,
    dataTable(["Team", "Manager", "CSAT", "NPS", "FCR", "QA", "AHT", "Surveys", "Calls"],
      d.teams.map((t) => [t.team, t.manager, pct1(t.csat), pct1(t.nps), pct1(t.fcr), pct1(t.qa), t.aht.toFixed(2), n1(t.surveys), n0(t.calls)]))
  ));

  /* breakdown: tenure */
  const tenMax = Math.max.apply(null, d.tenure.map((t) => t[state.breakdown]).concat([k.target])) * 1.18;
  const drawTen = (w, tip, box) => barChart(w, tip, box, {
    title: k.name + " by agent tenure",
    items: d.tenure.map((t) => ({
      label: t.bucket,
      value: t[state.breakdown],
      sub: `${t.agents} agents · ${n1(t.surveys)} surveys · ${n0(t.calls)} calls · AHT ${mins(t.aht)}`
    })),
    max: tenMax, fmt, target: k.target, color: "var(--s3)", rowH: 30
  });
  dashNode.appendChild(chartBlock(
    k.name + " by agent tenure",
    "Tenure is not evenly spread across teams, and tenure, handling time and team identity all move together.",
    drawTen,
    dataTable(["Tenure", "Agents", "CSAT", "NPS", "FCR", "QA", "AHT", "Surveys", "Calls"],
      d.tenure.map((t) => [t.bucket, t.agents, pct1(t.csat), pct1(t.nps), pct1(t.fcr), pct1(t.qa), t.aht.toFixed(2), n1(t.surveys), n0(t.calls)]))
  ));

  /* breakdown: call type */
  const types = d.callTypes.slice().sort((a, b) => b[state.breakdown] - a[state.breakdown]);
  const typeMax = Math.max.apply(null, types.map((t) => t[state.breakdown]).concat([k.target])) * 1.18;
  const drawTypes = (w, tip, box) => barChart(w, tip, box, {
    title: k.name + " by call type",
    items: types.map((t) => ({
      label: t.label, value: t[state.breakdown],
      sub: `${pct1(t.share)} of surveys · AHT ${mins(t.aht)} · FCR ${pct1(t.fcr)}`
    })),
    max: typeMax, fmt, target: k.target, color: "var(--s4)", rowH: 24
  });
  dashNode.appendChild(chartBlock(
    k.name + " by call type",
    "Sorted best to worst. Share of surveys varies from 14.8% down to 1.5%, so the bottom rows rest on far fewer responses.",
    drawTypes,
    dataTable(["Call type", "Share", "CSAT", "NPS", "FCR", "AHT"],
      types.map((t) => [t.label, pct1(t.share), pct1(t.csat), pct1(t.nps), pct1(t.fcr), t.aht.toFixed(2)]))
  ));

  /* QA audits */
  const q = d.qaAudits;
  const drawDrivers = (w, tip, box) => barChart(w, tip, box, {
    title: "QA audit failure drivers",
    items: q.drivers.map((x) => ({
      label: x.label, value: x.count,
      sub: `${((x.count / q.audits) * 100).toFixed(1)}% of ${n0(q.audits)} audits`
    })),
    max: Math.max.apply(null, q.drivers.map((x) => x.count)) * 1.08,
    fmt: (v) => n0(v), color: "var(--s2)", rowH: 26
  });
  dashNode.appendChild(chartBlock(
    "QA audit drivers",
    `${n0(q.audits)} audits, mean score ${q.meanScore}, ${q.passing} at or above the pass mark of ${q.passThreshold}. ${q.agentRelated} were classed agent related and ${q.notAgentRelated} not agent related.`,
    drawDrivers,
    dataTable(["Root cause", "Audits"], q.topCauses.map((x) => [x.label, n0(x.count)]))
  ));

  /* agent table */
  const agents = d.agents.slice().sort((a, b) => b[state.breakdown] - a[state.breakdown]);
  dashNode.appendChild(el("div", { class: "chart-block" }, [
    el("h3", { text: "Every consultant" }),
    el("p", { class: "chart-note", text: `All ${d.agents.length} consultants, month to date, sorted by ${k.name}.` }),
    dataTable(["Consultant", "Team", "Tenure", "CSAT", "NPS", "FCR", "QA", "AHT", "Calls"],
      agents.map((a) => [a.name, a.team, a.tenure, pct1(a.csat), pct1(a.nps), pct1(a.fcr), pct1(a.qa), a.aht.toFixed(2), n0(a.calls)]))
  ]));

  /* definitions */
  dashNode.appendChild(el("div", { class: "chart-block" }, [
    el("h3", { text: "How each KPI is defined" }),
    el("p", { class: "chart-note", text: "Taken from the workbook's own KPI sheet." }),
    dataTable(["KPI", "Source", "Question", "Calculation", "Target", "Notes"],
      d.kpis.map((x) => [x.name, x.source, x.question, x.calculation, fmtVal(x.target, x.format), x.notes]))
  ]));

  /* caveats */
  dashNode.appendChild(el("div", { class: "card card-flag" }, [
    el("div", { class: "eyebrow", text: "How this dashboard was built" }),
    el("p", { class: "hint", text: "Facts about the data, not conclusions about it. What they mean for your decision is yours to argue." }),
    el("ul", { class: "notes", style: { marginTop: "12px" } }, d.caveats.map((c) => el("li", { text: c })))
  ]));

  chartTarget = "view";
}

function rebuildDashboard() {
  const host = dashNode.parentNode;
  const old = dashNode;
  buildDashboard();
  if (host) host.replaceChild(dashNode, old);
}
</script>

<script>
"use strict";

/* ===================================================================== *
 * Views
 * ===================================================================== */

const sessionHost = $("#view-session");
const metricsHost = $("#view-metrics");
const progressHost = $("#view-progress");
const fileInput = $("#file-input");

function busyEl(label) {
  return el("span", { class: "busy" }, [el("i", { class: "dot" }), label + "..."]);
}

/* ---------- stage indicator ---------- */

function stepsEl() {
  return el("ol", { class: "steps" }, state.stages.map((s, i) => {
    const cls = state.index === i ? "current" : (stageDone(i) || i < state.index ? "done" : "");
    return el("li", { class: "step " + cls }, [
      el("button", {
        class: "step-btn",
        disabled: i > state.index,
        "aria-current": state.index === i ? "step" : null,
        title: s.name,
        onclick: () => { if (i <= state.index) { state.index = i; state.error = ""; saveDraft(); render(); } }
      }, [
        el("span", { class: "step-n", text: "Stage " + s.id }),
        el("span", { class: "step-name", text: s.short || s.name })
      ])
    ]);
  }));
}

/* ---------- stage panel ---------- */

function stagePanel() {
  const i = state.index;
  const s = state.stages[i];
  const e = entry(i);
  const wrap = el("div", { class: "stack-s" });

  wrap.appendChild(el("h1", { text: s.question }));
  wrap.appendChild(el("p", { class: "lede", text: s.help }));

  if (i === 0) wrap.appendChild(uploadRow());

  if (i === 3) {
    if (e.opposingCase) {
      wrap.appendChild(el("div", { class: "card card-accent", "data-role": "opposing" }, [
        el("div", { class: "eyebrow", text: "The strongest case against you" }),
        el("p", { class: "prose", text: e.opposingCase })
      ]));
    } else if (state.busy) {
      wrap.appendChild(el("div", { class: "card" }, [busyEl(state.busy)]));
    } else {
      wrap.appendChild(el("div", { class: "card" }, [
        el("p", { class: "hint", text: "The opposing case has not been built yet." }),
        el("div", { class: "btn-row", style: { marginTop: "12px" } }, [
          el("button", { class: "btn", text: "Build it", onclick: ensureOpposing })
        ])
      ]));
    }
  }

  const area = el("textarea", {
    placeholder: s.placeholder,
    "aria-label": s.question,
    disabled: Boolean(i === 3 && !e.opposingCase)
  });
  area.value = e.input || "";
  const count = el("p", { class: "count" });
  const updateCount = () => {
    const words = e.input.trim() ? e.input.trim().split(/\s+/).length : 0;
    count.textContent = words === 0 ? "Empty - you cannot move on without an answer." : words + (words === 1 ? " word" : " words");
    submitBtn.disabled = !e.input.trim() || Boolean(state.busy);
  };
  area.addEventListener("input", () => { e.input = area.value; saveDraft(); updateCount(); });
  wrap.appendChild(area);
  wrap.appendChild(count);

  if (state.error) wrap.appendChild(el("p", { class: "banner banner-bad", text: state.error }));

  const submitBtn = el("button", {
    class: "btn btn-primary",
    text: e.coach ? "Submit revision" : "Get coaching",
    onclick: submitStage
  });
  const row = el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-quiet", text: "Back", disabled: i === 0 || Boolean(state.busy), onclick: () => { state.index--; state.error = ""; saveDraft(); render(); } }),
    submitBtn,
    state.busy ? busyEl(state.busy) : null,
    el("span", { class: "spacer" }),
    el("button", {
      class: "btn",
      text: i === 5 ? "Finish and score" : "Continue",
      disabled: !stageDone(i) || Boolean(state.busy),
      onclick: nextStage
    })
  ]);
  wrap.appendChild(row);
  updateCount();

  if (e.coach) {
    wrap.appendChild(el("div", { class: "card " + (e.onTopic === false ? "card-flag" : "card-accent"), "data-role": "coach" }, [
      el("div", { class: "eyebrow", text: "Coach" }),
      e.flaw ? el("p", { style: { marginBottom: "10px" } }, [el("span", { class: "tag tag-flaw", text: e.flaw })]) : null,
      el("p", { class: "prose", text: e.coach }),
      e.onTopic === false
        ? el("p", { class: "hint", style: { marginTop: "12px" }, text: "Revise your answer and resubmit before moving on." })
        : null
    ]));
  }

  return wrap;
}

/* ---------- document upload (stage 1 only) ---------- */

function uploadRow() {
  const box = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Optional" }),
    el("p", { class: "hint", text: "Upload an email thread, incident report or performance note and the app will pull the decision at stake out of it. Plain text, markdown, CSV or PDF, up to 3 MB. It only feeds this stage." }),
    el("div", { class: "file-row", style: { marginTop: "12px" } }, [
      el("button", { class: "btn", text: "Choose a document", disabled: Boolean(state.busy), onclick: () => fileInput.click() }),
      state.busy === "Reading your document" ? busyEl(state.busy) : null
    ])
  ]);

  if (state.extract) {
    box.appendChild(el("dl", { class: "kv", style: { marginTop: "16px" } }, [
      el("dt", { text: "Decision" }), el("dd", { text: state.extract.decision || "-" }),
      el("dt", { text: "Deadline" }), el("dd", { text: state.extract.deadline || "none stated" }),
      el("dt", { text: "Affects" }), el("dd", { text: state.extract.stakeholders.length ? state.extract.stakeholders.join(", ") : "none stated" })
    ]));
    box.appendChild(el("p", { class: "hint", style: { marginTop: "12px" }, text: "A draft has been put in the box below. Edit it until it is yours before submitting." }));
  }
  return box;
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    state.error = "That file is larger than 3 MB. Trim it or paste the relevant part instead.";
    render();
    return;
  }
  state.busy = "Reading your document";
  state.error = "";
  render();
  try {
    let payload;
    if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));
        r.onerror = () => reject(new Error("Could not read that file."));
        r.readAsDataURL(file);
      });
      payload = { pdf: dataUrl.split(",")[1], filename: file.name };
    } else {
      payload = { text: await file.text(), filename: file.name };
    }
    const out = await api("extract", payload);
    state.extract = out;
    const e = entry(0);
    if (!e.input.trim()) e.input = out.draft;
    saveDraft();
  } catch (err) {
    state.error = err.message;
  }
  state.busy = null;
  render();
});

/* ---------- stage actions ---------- */

async function submitStage() {
  const i = state.index;
  const e = entry(i);
  if (!e.input.trim()) { state.error = "Write an answer before asking for coaching."; render(); return; }
  state.busy = "Reading your answer";
  state.error = "";
  render();
  try {
    const out = await api("coach", {
      stage: i + 1,
      input: e.input,
      history: historyPayload(i),
      opposingCase: e.opposingCase || null
    });
    e.coach = out.response;
    e.flaw = out.flaw;
    e.onTopic = out.onTopic;
    e.scores = out.scores;
    state.summary = null;
    state.savedId = null;
  } catch (err) {
    state.error = err.message;
  }
  state.busy = null;
  saveDraft();
  render();
}

async function ensureOpposing() {
  const e = entry(3);
  if (state.index !== 3 || e.opposingCase || state.busy) return;
  state.busy = "Building the opposing case";
  state.error = "";
  render();
  try {
    const out = await api("oppose", { history: historyPayload(3) });
    e.opposingCase = out.case;
  } catch (err) {
    state.error = err.message;
  }
  state.busy = null;
  saveDraft();
  render();
}

async function nextStage() {
  if (state.index < 5) {
    state.index++;
    state.error = "";
    saveDraft();
    render();
    if (state.index === 3) ensureOpposing();
    return;
  }
  state.busy = "Writing your summary";
  state.error = "";
  render();
  try {
    const out = await api("summary", { history: historyPayload(6) });
    state.summary = out;
    state.index = 6;
    persistSession(out);
  } catch (err) {
    state.error = err.message;
  }
  state.busy = null;
  saveDraft();
  render();
}

function persistSession(summary) {
  if (state.savedId) return;
  const id = "s" + Date.now();
  state.savedId = id;
  state.sessions.push({
    id,
    date: new Date().toISOString(),
    title: summary.title,
    dimensions: summary.dimensions,
    summary,
    entries: state.entries.map((e, i) => ({
      stage: i + 1,
      input: e.input,
      coach: e.coach,
      flaw: e.flaw,
      opposingCase: e.opposingCase,
      scores: e.scores
    }))
  });
  save(SESSIONS_KEY, state.sessions);
}

function resetSession() {
  state.index = 0;
  state.entries = [];
  state.summary = null;
  state.savedId = null;
  state.extract = null;
  state.error = "";
  drop(DRAFT_KEY);
  render();
}

/* ---------- summary ---------- */

function scoreGrid(dimensions) {
  return el("div", { class: "scores" }, DIMS.map((d) => {
    const v = dimensions[d.id] || {};
    const score = typeof v.score === "number" ? v.score : null;
    return el("div", { class: "score" }, [
      el("div", { class: "score-head" }, [
        el("span", { class: "score-name", text: d.label }),
        el("span", { class: "score-val", text: score === null ? "-" : score.toFixed(1) })
      ]),
      el("div", { class: "score-bar" }, [
        el("div", { class: "score-fill", style: { width: ((score === null ? 0 : (score - 1) / 4) * 100) + "%", background: d.color } })
      ]),
      el("p", { class: "score-just", text: v.justification || "" })
    ]);
  }));
}

function summaryEl(summary, opts) {
  const readOnly = Boolean(opts && opts.readOnly);
  const wrap = el("div", { class: "stack" });

  wrap.appendChild(el("div", null, [
    el("div", { class: "eyebrow", text: readOnly ? "Past session" : "Session complete" }),
    el("h1", { text: summary.title }),
    el("p", { class: "lede", style: { marginTop: "8px" }, text: "Your reasoning across six stages, scored 1 to 5 on four dimensions. Each score is the mean of the six stage scores." })
  ]));

  wrap.appendChild(scoreGrid(summary.dimensions));

  wrap.appendChild(el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Your reasoning chain" }),
    el("ol", { class: "chain" }, (summary.chain || []).map((c) => {
      const st = state.stages.find((s) => s.id === c.stage);
      return el("li", null, [el("div", null, [
        el("b", { text: st ? st.name : "Stage " + c.stage }),
        el("span", { text: c.recap })
      ])]);
    }))
  ]));

  wrap.appendChild(el("div", { class: "card card-flag" }, [
    el("div", { class: "eyebrow", text: "Where the reasoning was weak" }),
    el("ul", { class: "notes" }, (summary.weaknesses || []).map((w) => el("li", { text: w })))
  ]));

  wrap.appendChild(el("div", { class: "card card-accent" }, [
    el("div", { class: "eyebrow", text: "What you did well" }),
    el("ul", { class: "notes" }, (summary.strengths || []).map((w) => el("li", { text: w })))
  ]));

  if (!readOnly) {
    if (state.error) wrap.appendChild(el("p", { class: "banner banner-bad", text: state.error }));
    wrap.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-quiet", text: "Back to stage 6", onclick: () => { state.index = 5; render(); } }),
      el("span", { class: "spacer" }),
      el("button", { class: "btn", text: "See progress", onclick: () => setView("progress") }),
      el("button", { class: "btn btn-primary", text: "Start a new session", onclick: resetSession })
    ]));
  }
  return wrap;
}

/* ---------- session view ---------- */

function dashExpander() {
  const host = el("div", { style: { marginTop: "16px" } });
  const box = el("details", { class: "card", style: { marginTop: "0", paddingTop: "20px", borderTop: "1px solid var(--line)" } }, [
    el("summary", { text: "Consult the dashboard" }),
    host
  ]);
  if (state.dashOpen) box.setAttribute("open", "");
  box.addEventListener("toggle", () => {
    state.dashOpen = box.open;
    if (box.open) { host.appendChild(dashNode); redrawAll(); }
  });
  if (state.dashOpen) { host.appendChild(dashNode); requestAnimationFrame(redrawAll); }
  return box;
}

function renderSessionView() {
  sessionHost.innerHTML = "";
  if (!state.dash) {
    sessionHost.appendChild(el("p", { class: state.error ? "banner banner-bad" : "busy", text: state.error || "Loading..." }));
    return;
  }
  sessionHost.appendChild(stepsEl());
  if (state.index >= 6 && state.summary) {
    sessionHost.appendChild(summaryEl(state.summary));
  } else if (state.busy === "Writing your summary") {
    sessionHost.appendChild(el("div", { class: "card" }, [busyEl(state.busy)]));
  } else {
    sessionHost.appendChild(stagePanel());
  }
  sessionHost.appendChild(dashExpander());
}

/* ---------- dashboard view ---------- */

function renderMetricsView() {
  metricsHost.innerHTML = "";
  if (!state.dash) return;
  metricsHost.appendChild(dashNode);
  redrawAll();
}

/* ---------- progress view ---------- */

function renderProgressView() {
  chartRegistries.view.length = 0;
  progressHost.innerHTML = "";
  progressHost.appendChild(el("div", null, [
    el("h1", { text: "Progress" }),
    el("p", { class: "lede", style: { marginTop: "8px" }, text: "Scores from completed sessions, kept in this browser." })
  ]));

  const done = state.sessions.filter((s) => DIMS.every((d) => typeof (s.dimensions[d.id] || {}).score === "number"));

  if (!done.length) {
    progressHost.appendChild(el("div", { class: "card" }, [
      el("p", { class: "hint", text: "No completed sessions yet. Finish all six stages and the scores will appear here." })
    ]));
    return;
  }

  const cats = done.map((s) => new Date(s.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" }));
  const series = DIMS.map((d) => ({ name: d.label.split(" ")[0], color: d.color, values: done.map((s) => s.dimensions[d.id].score) }));
  const draw = (w, tip, box) => lineChart(w, tip, box, {
    title: "Scores over time",
    categories: cats, series, min: 1, max: 5, step: 1,
    axisFmt: (v) => v.toFixed(0), tipFmt: (v) => v.toFixed(1) + " / 5"
  });
  draw.legendSeries = DIMS.map((d, i) => ({ name: d.label, color: d.color }));
  progressHost.appendChild(chartBlock(
    "Scores over time",
    "One line per dimension, oldest session first. Each point is the mean of that session's six stage scores.",
    draw,
    dataTable(["Session", "Decision"].concat(DIMS.map((d) => d.label)),
      done.map((s, i) => [cats[i], s.title].concat(DIMS.map((d) => s.dimensions[d.id].score.toFixed(1)))))
  ));

  progressHost.appendChild(el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Past sessions" }),
    el("ul", { class: "sessions" }, state.sessions.slice().reverse().map((s) => el("li", null, [
      el("div", null, [
        el("div", { class: "title", text: s.title }),
        el("div", { class: "when", text: new Date(s.date).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) })
      ]),
      el("span", { class: "spacer" }),
      el("button", {
        class: "btn btn-quiet",
        text: state.reviewing === s.id ? "Hide" : "View",
        onclick: () => { state.reviewing = state.reviewing === s.id ? null : s.id; render(); }
      }),
      el("button", {
        class: "btn btn-quiet",
        text: "Delete",
        onclick: () => {
          state.sessions = state.sessions.filter((x) => x.id !== s.id);
          save(SESSIONS_KEY, state.sessions);
          if (state.reviewing === s.id) state.reviewing = null;
          render();
        }
      })
    ])))
  ]));

  const open = state.sessions.find((s) => s.id === state.reviewing);
  if (open) progressHost.appendChild(summaryEl(open.summary, { readOnly: true }));
}

/* ===================================================================== *
 * Shell: tabs, theme, boot
 * ===================================================================== */

function setView(view) {
  state.view = view;
  closeNav();
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* The six stages, mirrored into the sidebar so position is always visible. */
function renderNavStages() {
  const host = $("#nav-stages");
  host.innerHTML = "";
  if (!state.stages.length) return;
  state.stages.forEach((st, i) => {
    const reachable = i <= state.index;
    const btn = el("button", {
      class: "tab",
      disabled: !reachable,
      "aria-current": state.view === "session" && state.index === i ? "page" : null,
      onclick: () => {
        if (!reachable) return;
        state.index = i;
        state.error = "";
        saveDraft();
        setView("session");
      }
    }, [stageGlyph(i), el("span", { text: st.short || st.name })]);
    host.appendChild(btn);
  });

  const pill = $("#stage-pill");
  if (state.view === "session" && state.index < 6) {
    pill.hidden = false;
    pill.innerHTML = "";
    pill.append("Stage ", el("b", { text: String(state.index + 1) }), " of 6");
  } else if (state.view === "session" && state.summary) {
    pill.hidden = false;
    pill.textContent = "Session complete";
  } else {
    pill.hidden = true;
  }
}

/* A numbered disc: filled when the stage is signed off, outlined otherwise. */
function stageGlyph(i) {
  const done = stageDone(i);
  const current = state.index === i;
  const g = svg("svg", { width: 18, height: 18, viewBox: "0 0 18 18", "aria-hidden": "true" });
  g.appendChild(svg("circle", {
    cx: 9, cy: 9, r: 8,
    style: {
      fill: done ? "var(--accent)" : "none",
      stroke: done ? "var(--accent)" : current ? "var(--accent)" : "currentColor",
      opacity: done || current ? 1 : 0.5
    },
    "stroke-width": 1.4
  }));
  if (done) {
    g.appendChild(svg("path", {
      d: "m5.6 9.2 2.2 2.2 4.6-4.8", fill: "none",
      style: { stroke: "#fff" }, "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round"
    }));
  } else {
    g.appendChild(svg("text", {
      x: 9, y: 12.4, "text-anchor": "middle", "font-size": 9, "font-weight": 600,
      style: { fill: "currentColor" }, text: String(i + 1)
    }));
  }
  return g;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => {
    const on = t.dataset.view === state.view;
    if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  sessionHost.hidden = state.view !== "session";
  metricsHost.hidden = state.view !== "metrics";
  progressHost.hidden = state.view !== "progress";
  if (state.view === "session") renderSessionView();
  else if (state.view === "metrics") renderMetricsView();
  else renderProgressView();
  renderNavStages();
}

$("#tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (btn && btn.dataset.view) setView(btn.dataset.view);
});

const navToggle = $("#nav-toggle");
function closeNav() {
  document.body.classList.remove("nav-open");
  navToggle.setAttribute("aria-expanded", "false");
}
navToggle.addEventListener("click", () => {
  const open = document.body.classList.toggle("nav-open");
  navToggle.setAttribute("aria-expanded", String(open));
});
$("#scrim").addEventListener("click", closeNav);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });

const themeBtn = $("#theme-btn");
const THEMES = ["system", "light", "dark"];
function applyTheme(theme) {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  themeBtn.innerHTML = "";
  themeBtn.append(el("span", { class: "lbl", text: "Theme:" }), el("b", { text: theme }));
  themeBtn.setAttribute("aria-label", "Colour theme: " + theme + ". Click to change.");
  save(THEME_KEY, theme);
}
themeBtn.addEventListener("click", () => {
  const next = THEMES[(THEMES.indexOf(store(THEME_KEY, "system")) + 1) % THEMES.length];
  applyTheme(next);
});
applyTheme(store(THEME_KEY, "system"));

async function boot() {
  render();
  try {
    const res = await fetch("/api/config");
    if (!res.ok) throw new Error("Could not load the session configuration (" + res.status + ").");
    const cfg = await res.json();
    state.stages = cfg.stages;
    state.dash = cfg.dashboard;
    state.breakdown = cfg.dashboard.focus;
  } catch (err) {
    state.error = err.message + " Check that the app is deployed with its API routes.";
    render();
    return;
  }

  const draft = store(DRAFT_KEY, null);
  if (draft && Array.isArray(draft.entries)) {
    state.entries = draft.entries;
    state.summary = draft.summary || null;
    state.index = Math.min(6, Math.max(0, Number(draft.index) || 0));
    if (state.index >= 6 && !state.summary) state.index = 5;
  }

  buildDashboard();
  render();
  if (state.index === 3) ensureOpposing();
}

boot();
</script>
</body>
